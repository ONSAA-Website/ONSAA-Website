# GitLab deploys a preview from draft.
# GitHub validates draft and deploys main.

default:
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

stages:
  - deploy

pages:
  stage: deploy
  variables:
    ASTRO_SITE: $CI_PAGES_URL
  script:
    - npm run check
    - |
      pages_path="$(printf '%s' "$CI_PAGES_URL" | sed -e 's|^[a-z][a-z0-9+.-]*://[^/]*||' -e 's|/*$||')"
      export ASTRO_BASE="${pages_path}/"
      printf 'Preview URL: %s\n' "$CI_PAGES_URL"
      printf 'Preview base path: %s\n' "$ASTRO_BASE"
    - npm run build
  pages:
    publish: dist
  rules:
    - if: '$CI_COMMIT_BRANCH == "draft"'

mirror-github:
  stage: deploy
  # Gated on the test stage: secret-scan and verify-main must pass first.
  # Then waits 15 minutes before syncing to GitHub. A human operator can
  # open the pipeline and either start it immediately or unschedule it
  # during that window; doing nothing lets it fire automatically at 15m.
  image:
    name: alpine/git
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 1
  before_script: []
  script:
    - git config user.name "arpitdoesphoto"
    - git config user.email "arpitdoesphoto@gmail.com"
    - git checkout --orphan mirror-main
    - git add -A
    - git commit --author="shahi7 <69171919+shahi7@users.noreply.github.com>" -m "Sync from GitLab main @ ${CI_COMMIT_SHORT_SHA}"
    - git push --force "https://x-access-token:${GITHUB_MIRROR_PAT}@github.com/ONSAA-Website/ONSAA-Website.git" mirror-main:main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: delayed
      start_in: 15 minutes
