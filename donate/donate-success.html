<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="./styles/main.css" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Donation received | ONSAA</title>
  <meta name="description" content="Thank you for supporting ONSAA." />
  <style>
    .success-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 120px 20px;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .success-shell {
      width: min(700px, 100%);
      padding: 28px;
      border: 1px solid rgba(215, 25, 32, 0.32);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(215, 25, 32, 0.06), rgba(0, 0, 0, 0.24)), rgba(10, 10, 10, 0.48);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.34);
      text-align: center;
    }

    .success-shell h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 0.95;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .success-shell p {
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.6;
    }

    .success-shell a {
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="success-page">
    <section class="success-shell">
      <h1>Thank you</h1>
      <p>Your donation has been submitted. Your support helps fund student organizing and campaign work.</p>
      <p><a href="./index.html">Return to home</a></p>
    </section>
  </main>
</body>
</html>
