<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../styles/main.css" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Donation received | ONSAA</title>
  <meta name="description" content="Thank you for supporting ONSAA." />
  <style>

    :root {
      --frame-gap: calc(var(--edge-size) + 18px);
      --panel-radius: 24px;
      --content-max: 980px;
    }

    .page.page-inner {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .page-shell {
      position: fixed;
      top: var(--frame-gap);
      right: var(--frame-gap);
      bottom: var(--frame-gap);
      left: calc(var(--nav-width) + var(--frame-gap) + 18px);
      z-index: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 84px 18px 120px;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .inner-shell {
      width: min(var(--content-max), 100%);
      margin: 0 auto;
    }

    .success-content {
      width: min(760px, 100%);
      margin-inline: auto;
    }

    .success-panel {
      position: relative;
      padding: 28px;
      border: 1px solid rgba(215, 25, 32, 0.28);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(215, 25, 32, 0.05), rgba(0, 0, 0, 0.28)), rgba(8, 8, 8, 0.5);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .success-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    .success-kicker,
    .success-copy {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .success-kicker {
      margin: 0 0 12px;
      color: rgba(255,255,255,0.72);
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .success-title {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(2.8rem, 8vw, 5.8rem);
      line-height: 0.92;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      font-weight: 900;
    }

    .success-copy {
      margin: 14px 0 0;
      color: rgba(255,255,255,0.84);
      font-size: 1rem;
      line-height: 1.7;
      max-width: 54ch;
    }

    .success-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .success-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 18px;
      border: 1px solid rgba(215, 25, 32, 0.58);
      border-radius: 999px;
      background:
        linear-gradient(135deg, rgba(215, 25, 32, 0.16), rgba(0, 0, 0, 0.52)),
        rgba(0, 0, 0, 0.36);
      color: rgba(255,255,255,0.94);
      text-decoration: none;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (max-width: 720px) {
      .success-panel {
        padding: 22px 18px;
      }

      .success-title {
        font-size: clamp(2.4rem, 15vw, 4.6rem);
      }

      .success-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page page-inner">
    <div class="edge-blur" aria-hidden="true"></div>
    <div class="edge" aria-hidden="true"></div>

    <nav class="side-tabs" aria-label="Primary">
      <a href="../index.html">Home</a>
      <a href="../about-us/index.html">About us</a>
      <a href="../articles/index.html">Articles</a>
      <a href="../resource-guides/index.html">Resource guides</a>
      <a href="../news/index.html">News and updates</a>
      <a href="../petition/index.html">Sign Petition</a>
      <a href="../volunteer/index.html">Volunteer with us</a>
      <a href="../donate/index.html" aria-current="page">Donate</a>
    </nav>


    <a class="logo-frame" href="./index.html" aria-label="Go to home page">
      <img class="logo" src="./assets/logo.png" alt="ONSAA logo" />
    </a>

    <div class="social-links" aria-label="Social and contact links">
      <a
        class="social-link"
        href="https://www.instagram.com/ontariostudentstrike/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Follow ONSAA on Instagram"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M7.75 2h8.5A5.76 5.76 0 0 1 22 7.75v8.5A5.76 5.76 0 0 1 16.25 22h-8.5A5.76 5.76 0 0 1 2 16.25v-8.5A5.76 5.76 0 0 1 7.75 2Zm0 1.8A3.96 3.96 0 0 0 3.8 7.75v8.5a3.96 3.96 0 0 0 3.95 3.95h8.5a3.96 3.96 0 0 0 3.95-3.95v-8.5a3.96 3.96 0 0 0-3.95-3.95h-8.5ZM12 7.1a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8Zm0 1.8a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2Zm5.1-2.95a1.15 1.15 0 1 1 0 2.3 1.15 1.15 0 0 1 0-2.3Z" />
        </svg>
      </a>

      <a
        class="social-link"
        href="mailto:on.students.against.austerity@gmail.com"
        aria-label="Email ONSAA"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M3 6.75A1.75 1.75 0 0 1 4.75 5h14.5A1.75 1.75 0 0 1 21 6.75v10.5A1.75 1.75 0 0 1 19.25 19H4.75A1.75 0 0 1 3 17.25V6.75Zm1.8.42v.19l7.2 5.4 7.2-5.4v-.19a.35.35 0 0 0-.35-.35H5.15a.35.35 0 0 0-.35.35Zm14.4 2.44-6.66 5a.9.9 0 0 1-1.08 0l-6.66-5v7.64c0 .2.16.35.35.35h13.7c.19 0 .35-.15.35-.35V9.61Z" />
        </svg>
      </a>
    </div>

    <section class="page-shell">
      <div class="inner-shell">
        <div class="success-panel">
          <p class="success-kicker">Contribution received</p>
          <h1 class="success-title">Thank you</h1>
          <p class="success-copy">
            Your donation helps fund organizing, materials, outreach, and student-led actions across Ontario. Every contribution strengthens the work.
          </p>

          <div class="success-actions">
            <a href="./index.html">Return home</a>
            <a href="./volunteer/index.html">Volunteer with us</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
