<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="./styles/main.css" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Donate | ONSAA</title>
  <meta name="description" content="Support ONSAA with a donation." />
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    .donate-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 120px 20px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .donate-shell {
      width: min(760px, 100%);
      padding: 28px;
      border: 1px solid rgba(215, 25, 32, 0.32);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(215, 25, 32, 0.06), rgba(0, 0, 0, 0.24)), rgba(10, 10, 10, 0.48);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.34);
    }

    .donate-shell h1 {
      margin: 0 0 10px;
      font-size: clamp(2.1rem, 5vw, 3.5rem);
      line-height: 0.95;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .donate-shell p {
      margin: 0 0 18px;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.6;
    }

    .amount-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 20px 0 14px;
    }

    .amount-button,
    .submit-button {
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid rgba(215, 25, 32, 0.72);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.92);
      background:
        linear-gradient(135deg, rgba(215, 25, 32, 0.18), rgba(0, 0, 0, 0.52)),
        rgba(0, 0, 0, 0.44);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .amount-button.is-active {
      background: linear-gradient(135deg, rgba(143, 15, 20, 0.58), rgba(68, 6, 9, 0.72)), #8f0f14;
    }

    .custom-row {
      margin-bottom: 18px;
    }

    .custom-row input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.42);
      color: #fff;
      font: inherit;
    }

    .element-label {
      margin: 18px 0 10px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
    }

    #express-checkout-element,
    #payment-element {
      border-radius: 12px;
    }

    #payment-element {
      margin-top: 8px;
      margin-bottom: 18px;
    }

    .status-text {
      min-height: 24px;
      margin: 10px 0 0;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
    }

    .submit-button {
      width: 100%;
    }

    .submit-button[disabled] {
      opacity: 0.6;
      cursor: wait;
    }

    @media (max-width: 760px) {
      .amount-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="donate-page">
    <section class="donate-shell">
      <h1>Donate</h1>
      <p>Your contribution helps fund organizing, outreach, and campaign materials.</p>

      <div class="amount-grid">
        <button class="amount-button" data-amount="500">$5</button>
        <button class="amount-button" data-amount="1000">$10</button>
        <button class="amount-button" data-amount="2500">$25</button>
        <button class="amount-button is-active" data-amount="5000">$50</button>
      </div>

      <div class="custom-row">
        <input id="customAmount" type="number" min="1" step="1" placeholder="Custom amount in CAD" />
      </div>

      <div class="element-label">Quick pay</div>
      <div id="express-checkout-element"></div>

      <div class="element-label">Card details</div>
      <div id="payment-element"></div>

      <button id="submit" class="submit-button">Donate now</button>
      <p id="statusText" class="status-text"></p>
    </section>
  </main>

  <script>
    const stripe = Stripe("pk_live_51TpyaPPpUdhLotnY76VFytFA5SU5d0eUcUV7FC6bfPd7Ef0pggzsDlDuNZCiMkWsmFz5u4IGXtgLvUEjvuzFVAN000beROHCgN");
    const amountButtons = document.querySelectorAll(".amount-button");
    const customAmountInput = document.getElementById("customAmount");
    const submitButton = document.getElementById("submit");
    const statusText = document.getElementById("statusText");

    let selectedAmount = 5000;
    let elements;
    let paymentElement;
    let expressCheckoutElement;
    let clientSecret;

    function setActiveButton(activeButton) {
      amountButtons.forEach((button) => {
        button.classList.toggle("is-active", button === activeButton);
      });
    }

    function getSelectedAmount() {
      const customValue = Number(customAmountInput.value);
      if (customValue > 0) {
        return Math.round(customValue * 100);
      }
      return selectedAmount;
    }

    amountButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        selectedAmount = Number(button.dataset.amount);
        customAmountInput.value = "";
        setActiveButton(button);
        await setupElements(getSelectedAmount());
      });
    });

    customAmountInput.addEventListener("change", async () => {
      amountButtons.forEach((button) => button.classList.remove("is-active"));
      const amount = getSelectedAmount();
      if (amount >= 100) {
        await setupElements(amount);
      }
    });

    async function createIntent(amount) {
      const response = await fetch("http://localhost:3000/create-payment-intent", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ amount })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Unable to create payment intent.");
      }

      return data.clientSecret;
    }

    async function setupElements(amount) {
      statusText.textContent = "Loading secure payment form...";

      clientSecret = await createIntent(amount);

      if (paymentElement) paymentElement.destroy();
      if (expressCheckoutElement) expressCheckoutElement.destroy();

      const appearance = {
        theme: "night",
        variables: {
          colorPrimary: "#d71920",
          colorBackground: "#121212",
          colorText: "#ffffff",
          colorDanger: "#ff5a5f",
          fontFamily: "Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif",
          borderRadius: "10px"
        }
      };

      elements = stripe.elements({
        clientSecret,
        appearance
      });

      expressCheckoutElement = elements.create("expressCheckout");
      expressCheckoutElement.mount("#express-checkout-element");

      paymentElement = elements.create("payment", {
        layout: "tabs"
      });
      paymentElement.mount("#payment-element");

      statusText.textContent = "";
    }

    submitButton.addEventListener("click", async (event) => {
      event.preventDefault();

      if (!elements) return;

      submitButton.disabled = true;
      statusText.textContent = "Processing donation...";

      const { error: submitError } = await elements.submit();
      if (submitError) {
        statusText.textContent = submitError.message;
        submitButton.disabled = false;
        return;
      }

      const { error } = await stripe.confirmPayment({
        elements,
        confirmParams: {
          return_url: "http://127.0.0.1:5500/donate-success.html"
        }
      });

      if (error) {
        statusText.textContent = error.message || "Something went wrong.";
        submitButton.disabled = false;
      }
    });

    setupElements(selectedAmount).catch((error) => {
      statusText.textContent = error.message || "Unable to load payment form.";
    });
  </script>
</body>
</html>
