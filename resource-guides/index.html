<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resource guide | ONSAA</title>
  <meta name="description" content="Resources, reading, and organizing tools from ONSAA." />
  <link rel="stylesheet" href="../styles/main.css" />
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: #050505; color: #fff; }

    :root {
      --frame-gap: calc(var(--edge-size) + 18px);
      --panel-radius: 24px;
      --content-max: 1080px;
    }

    .page.page-inner { position: fixed; inset: 0; overflow: hidden; }

    .side-tabs,
    .logo-frame,
    .social-links {
      position: fixed;
      z-index: 9999 !important;
    }

    .edge,
    .edge-blur,
    .page-shell::before,
    .page-shell::after {
      pointer-events: none;
    }

    .page-shell {
      z-index: 1 !important;
      position: fixed;
      top: var(--frame-gap);
      right: var(--frame-gap);
      bottom: var(--frame-gap);
      left: calc(var(--nav-width) + var(--frame-gap) + 18px);
      z-index: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 84px 18px 120px;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .inner-shell { width: min(var(--content-max), 100%); margin: 0 auto; }
    .panel, .resource-card {
      border: 1px solid rgba(215, 25, 32, 0.32);
      border-radius: var(--panel-radius);
      background: linear-gradient(180deg, rgba(215,25,32,.06), rgba(0,0,0,.24)), rgba(10,10,10,.48);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 46px rgba(0,0,0,.34);
    }
    .panel { padding: 28px; margin-bottom: 18px; }
    .panel h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 4rem); line-height: .95; font-weight: 900; text-transform: uppercase; letter-spacing: -.05em; color: #fff; }
    .panel p, .resource-card p, .resource-card li { color: rgba(255,255,255,.9); line-height: 1.6; }
    .resource-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .resource-card { padding: 24px; }
    .resource-card h2 { margin: 0 0 10px; color: #fff; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .05em; }
    .resource-card ul { margin: 12px 0 0; padding-left: 18px; }

    @media (max-width: 900px) {
      html, body { overflow: auto; }
      .page.page-inner { position: relative; inset: auto; min-height: 100dvh; }
      .page-shell { position: relative; top: auto; right: auto; bottom: auto; left: auto; overflow: visible; padding: max(96px, var(--frame-gap)) max(16px, var(--frame-gap)) max(96px, var(--frame-gap)); }
      .inner-shell, .resource-grid { width: 100%; }
      .resource-grid { grid-template-columns: 1fr; }
      .panel, .resource-card { border-radius: 18px; }
    }
  </style>
</head>
<body>
